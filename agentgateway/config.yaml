# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# The admin UI is published on 127.0.0.1 by Compose, but the process must bind
# it on all container interfaces for the port mapping to work.
config:
  adminAddr: "0.0.0.0:15000"

frontendPolicies:
  tracing:
    # agentgateway runs in the control plane, so it can export traces to MLflow
    # without giving the job microVM any additional network path.
    host: "$MLFLOW_OTLP_HOST:$MLFLOW_OTLP_PORT"
    path: /v1/traces
    protocol: http
    randomSampling: true
    policies:
      backendAuth:
        credentials:
          - key: "$MLFLOW_EXPERIMENT_ID"
            location:
              header:
                name: x-mlflow-experiment-id
#
# agentgateway holds the real OpenRouter key. Clients authenticate with a
# virtual key and never see the provider credential. The virtual key comes from
# .env, so this file is safe to commit.
llm:
  policies:
    apiKey:
      mode: strict
      keys:
        - key: "$LLM_GATEWAY_VIRTUAL_KEY"
          metadata:
            name: kafkallm-worker
  models:
    - name: "*"
      provider: openrouter
      params:
        apiKey: "$OPENROUTER_API_KEY"
