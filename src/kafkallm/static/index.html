<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kafkallm · goose jobs</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --panel: #ffffff;
      --panel-soft: #fafafa;
      --text: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --border-soft: #f0f0f1;
      --accent: #18181b;
      --accent-soft: #f4f4f5;
      --ok: #15803d;
      --warn: #a16207;
      --err: #b91c1c;
      --info: #1d4ed8;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    header .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    header a.sub {
      text-decoration: none;
    }
    header a.sub:hover {
      color: var(--text);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 860px) {
      header { padding-top: 24px; }
      main { grid-template-columns: 1fr; }
    }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    h2 {
      margin: 0 0 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 12px;
      font-weight: 550;
      color: var(--muted);
    }
    input, textarea, select {
      width: 100%;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #a1a1aa;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    textarea {
      min-height: 140px;
      resize: vertical;
    }
    #input {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    input[type="file"] {
      color: var(--muted);
      font-size: 12px;
      padding: 8px;
    }
    input[type="file"]::file-selector-button {
      margin-right: 10px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--panel-soft);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s ease, opacity .15s ease;
    }
    button:hover { background: #27272a; }
    button:disabled { opacity: .45; cursor: wait; }
    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 8px;
    }
    .message {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
    }
    .message.error { color: var(--err); }
    .message.ok { color: var(--ok); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      padding: 0 8px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-align: left;
    }
    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--panel-soft); }
    tbody tr.selected { background: var(--accent-soft); }
    tbody tr:last-child td { border-bottom: 0; }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge.queued { background: #fef3c7; color: var(--warn); }
    .badge.running { background: #dbeafe; color: var(--info); }
    .badge.succeeded { background: #dcfce7; color: var(--ok); }
    .badge.failed, .badge.invalid { background: #fee2e2; color: var(--err); }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .muted { color: var(--muted); }
    .snippet {
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty {
      padding: 28px 8px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    #jobs { overflow-x: auto; }
    #detail section {
      margin-top: 24px;
      padding: 20px 0 0;
      border: 0;
      border-top: 1px solid var(--border);
      border-radius: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px 20px;
      margin-bottom: 4px;
    }
    .field .k {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    .field .v {
      margin-top: 2px;
      font-size: 13px;
      word-break: break-word;
    }
    .block { margin-top: 20px; }
    .block h3 {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    pre {
      margin: 0;
      padding: 12px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: auto;
      max-height: 320px;
      white-space: pre-wrap;
      word-break: break-word;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .events { border-top: 1px solid var(--border-soft); }
    .event {
      padding: 10px 0;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      border-radius: 0;
      background: transparent;
    }
    .event:last-child { border-bottom: 0; }
    .event .line {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: baseline;
    }
    .event .type { font-weight: 600; }
    .event .err {
      margin-top: 4px;
      color: var(--err);
      font-size: 12px;
      white-space: pre-wrap;
    }
    a {
      color: var(--text);
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Kafkallm</h1>
      <p class="sub">goose jobs · Kafka queue · isolated microVMs</p>
    </div>
    <a class="sub" href="http://localhost:5000" target="_blank" rel="noreferrer">MLflow traces ↗</a>
  </header>

  <main>
    <section>
      <h2>Submit a job</h2>
      <form id="job-form">
        <label for="instruction">Instruction</label>
        <textarea id="instruction" required placeholder="Describe the result you want. Be specific about outputs and verification."></textarea>

        <label for="input">Structured input (JSON)</label>
        <textarea id="input" spellcheck="false">{}</textarea>

        <label for="files">Input files or binaries</label>
        <input id="files" type="file" multiple>
        <div class="hint">Any file type. Files are uploaded to RustFS and copied into the job at <span class="mono">/workspace/inputs</span>.</div>

        <div class="row">
          <div>
            <label for="timeout">Timeout (seconds)</label>
            <input id="timeout" type="number" min="1" max="3600" value="600">
          </div>
          <div>
            <label for="max_steps">Max steps</label>
            <input id="max_steps" type="number" min="1" max="50" value="12">
          </div>
        </div>

        <button id="submit" type="submit">Submit job</button>
        <div id="message" class="message"></div>
        <div class="hint">The worker runs the job in an isolated goose microVM. Files written to <span class="mono">outputs/</span> are uploaded as artifacts.</div>
      </form>
    </section>

    <section>
      <h2>Jobs</h2>
      <div id="jobs" class="empty">Loading…</div>
      <div id="detail"></div>
    </section>
  </main>

  <script>
    const state = { jobs: [], selected: null, timer: null };
    const $ = (id) => document.getElementById(id);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function fmtTime(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString();
    }

    function duration(job) {
      if (!job.started_at) return "—";
      const start = new Date(job.started_at).getTime();
      const end = job.finished_at ? new Date(job.finished_at).getTime() : Date.now();
      if (Number.isNaN(start) || Number.isNaN(end)) return "—";
      const seconds = Math.max(0, Math.round((end - start) / 1000));
      return seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
    }

    function badge(status) {
      return `<span class="badge ${esc(status)}">${esc(status)}</span>`;
    }

    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    async function uploadFiles(files) {
      const form = new FormData();
      for (const file of files) form.append("files", file, file.name);
      const data = await api("/api/uploads", { method: "POST", body: form });
      return data.input_files || [];
    }

    function renderJobs() {
      if (!state.jobs.length) {
        $("jobs").className = "empty";
        $("jobs").textContent = "No jobs yet. Submit one.";
        return;
      }
      $("jobs").className = "";
      const rows = state.jobs.map((job) => `
        <tr data-id="${esc(job.job_id)}" class="${job.job_id === state.selected ? "selected" : ""}">
          <td>${badge(job.status)}</td>
          <td class="mono">${esc(job.job_id)}</td>
          <td><div class="snippet" title="${esc(job.instruction)}">${esc(job.instruction)}</div></td>
          <td class="muted">${esc(fmtTime(job.submitted_at))}</td>
          <td class="muted">${esc(duration(job))}</td>
          <td class="muted">${esc(job.steps ?? 0)}</td>
        </tr>`).join("");
      $("jobs").innerHTML = `<table>
        <thead><tr><th>Status</th><th>Job</th><th>Instruction</th><th>Submitted</th><th>Duration</th><th>Steps</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
      for (const row of $("jobs").querySelectorAll("tbody tr")) {
        row.addEventListener("click", () => selectJob(row.dataset.id));
      }
    }

    async function loadJobs() {
      try {
        const data = await api("/api/jobs");
        state.jobs = data.jobs || [];
        renderJobs();
      } catch (error) {
        $("jobs").className = "empty";
        $("jobs").textContent = `Could not load jobs: ${error.message}`;
      }
    }

    async function selectJob(jobId) {
      state.selected = jobId;
      renderJobs();
      await loadDetail();
    }

    async function loadDetail() {
      if (!state.selected) { $("detail").innerHTML = ""; return; }
      try {
        const job = await api(`/api/jobs/${encodeURIComponent(state.selected)}`);
        $("detail").innerHTML = renderDetail(job);
      } catch (error) {
        $("detail").innerHTML = `<div class="message error">${esc(error.message)}</div>`;
      }
    }

    function renderDetail(job) {
      const usage = job.usage && Object.keys(job.usage).length
        ? Object.entries(job.usage).map(([k, v]) => `${esc(k)}=${esc(v)}`).join(" · ")
        : "—";
      const inputFiles = (job.input_files || []).length
        ? `<div class="events">${job.input_files.map((a) => `<div class="mono">${esc(a.bucket)}/${esc(a.key)}</div>`).join("")}</div>`
        : `<span class="muted">none</span>`;
      const artifacts = (job.artifacts || []).length
        ? `<div class="events">${job.artifacts.map((a) => `<div class="mono">${esc(a.bucket)}/${esc(a.key)}</div>`).join("")}</div>`
        : `<span class="muted">none</span>`;
      const events = (job.events || []).length
        ? `<div class="events">${job.events.map((event) => `
            <div class="event">
              <div class="line">
                <span class="type">${esc(event.type)}</span>
                <span class="muted">${esc(event.status)}</span>
                <span class="muted mono">${esc(fmtTime(event.timestamp))}</span>
                ${event.duration_ms ? `<span class="muted mono">${esc(Math.round(event.duration_ms))} ms</span>` : ""}
              </div>
              ${event.error ? `<div class="err">${esc(event.error)}</div>` : ""}
            </div>`).join("")}</div>`
        : `<span class="muted">No events yet.</span>`;
      return `<section>
        <h2>Job detail</h2>
        <div class="grid">
          <div class="field"><div class="k">Status</div><div class="v">${badge(job.status)}</div></div>
          <div class="field"><div class="k">Job</div><div class="v mono">${esc(job.job_id)}</div></div>
          <div class="field"><div class="k">Run</div><div class="v mono">${esc(job.run_id)}</div></div>
          <div class="field"><div class="k">Worker</div><div class="v mono">${esc(job.worker_id || "—")}</div></div>
          <div class="field"><div class="k">Submitted</div><div class="v">${esc(fmtTime(job.submitted_at))}</div></div>
          <div class="field"><div class="k">Started</div><div class="v">${esc(fmtTime(job.started_at))}</div></div>
          <div class="field"><div class="k">Finished</div><div class="v">${esc(fmtTime(job.finished_at))}</div></div>
          <div class="field"><div class="k">Usage</div><div class="v mono">${usage}</div></div>
        </div>
        <div class="block"><h3>Instruction</h3><pre>${esc(job.instruction)}</pre></div>
        ${job.result ? `<div class="block"><h3>Result</h3><pre>${esc(job.result)}</pre></div>` : ""}
        ${job.error ? `<div class="block"><h3>Error</h3><pre>${esc(job.error)}</pre></div>` : ""}
        ${job.artifact_error ? `<div class="block"><h3>Artifact error</h3><pre>${esc(job.artifact_error)}</pre></div>` : ""}
        <div class="block"><h3>Input files</h3>${inputFiles}</div>
        <div class="block"><h3>Artifacts</h3>${artifacts}</div>
        <div class="block"><h3>Audit events</h3>${events}</div>
      </section>`;
    }

    $("job-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = $("submit");
      const message = $("message");
      const files = Array.from($("files").files || []);
      button.disabled = true;
      message.className = "message";
      message.textContent = files.length ? "Uploading files…" : "Submitting…";
      try {
        const input = JSON.parse($("input").value || "{}");
        const inputFiles = files.length ? await uploadFiles(files) : [];
        message.textContent = "Submitting…";
        const payload = {
          instruction: $("instruction").value.trim(),
          input,
          input_files: inputFiles,
          timeout_seconds: Number($("timeout").value),
          max_steps: Number($("max_steps").value),
        };
        const job = await api("/api/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        message.className = "message ok";
        message.textContent = `Queued ${job.job_id}`;
        $("instruction").value = "";
        $("files").value = "";
        await loadJobs();
        await selectJob(job.job_id);
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    loadJobs();
    state.timer = setInterval(async () => {
      await loadJobs();
      await loadDetail();
    }, 2000);
  </script>
</body>
</html>
