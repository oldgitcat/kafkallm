[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kafkallm"
version = "0.1.0"
description = "Kafkallm: Kafka-based goose/goosetown job processing in isolated microVMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "confluent-kafka>=2.6,<3",
    "docker>=7.1,<8",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
kafkallm = "kafkallm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kafkallm = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
