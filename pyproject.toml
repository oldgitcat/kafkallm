[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gaensestall"
version = "0.1.0"
description = "Gänsestall: Kafka-based goose/goosetown job processing in isolated microVMs"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "boto3>=1.35,<2",
    "confluent-kafka>=2.6,<3",
    "docker>=7.1,<8",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17,<0.18",
]

[project.urls]
Homepage = "https://github.com/oldgitcat/kafkallm"
Repository = "https://github.com/oldgitcat/kafkallm"
Issues = "https://github.com/oldgitcat/kafkallm/issues"

[project.scripts]
gaensestall = "gaensestall.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["gaensestall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "frontend"]
addopts = "-q"
markers = [
    "integration: requires a running Kafka broker",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The formatter wraps code but cannot split long prompt strings.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
