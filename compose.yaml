name: gaensestall

x-app-environment: &app-environment
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Host-side data root. The worker and GUI run with a keep-id user namespace,
  # so they see the same files as the microVMs without world-writable modes.
  GAENSESTALL_JOB_ROOT: ${GAENSESTALL_JOB_ROOT:-${HOME}/.local/share/gaensestall}
  # Empty values intentionally fall back to the defaults in
  # backend/gaensestall/settings.py. That module is the single source of truth.
  JOBS_TOPIC: ${JOBS_TOPIC:-}
  RESULTS_TOPIC: ${RESULTS_TOPIC:-}
  STATE_TOPIC: ${STATE_TOPIC:-}
  EVENTS_TOPIC: ${EVENTS_TOPIC:-}
  AGENTS_TOPIC: ${AGENTS_TOPIC:-}
  SANDBOXES_TOPIC: ${SANDBOXES_TOPIC:-}
  CONTROL_TOPIC: ${CONTROL_TOPIC:-}
  LOGS_TOPIC: ${LOGS_TOPIC:-}
  KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-}
  KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-}
  KAFKA_TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-}
  KAFKA_STARTUP_TIMEOUT_SECONDS: ${KAFKA_STARTUP_TIMEOUT_SECONDS:-}
  WORKER_ID: ${WORKER_ID:-}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
  GOOSE_MODEL: ${GOOSE_MODEL:-}
  GOOSE_PROVIDER: ${GOOSE_PROVIDER:-}
  GOOSE_STARTUP_TIMEOUT_SECONDS: ${GOOSE_STARTUP_TIMEOUT_SECONDS:-}
  GOOSE_IMAGE: ${GOOSE_IMAGE:-}
  # Optional reverse-engineering sandbox (REA + Ghidra).
  GOOSE_RE_IMAGE: ${GOOSE_RE_IMAGE:-}
  # Distroless LLM proxy image started next to each job microVM.
  LLM_PROXY_IMAGE: ${LLM_PROXY_IMAGE:-}
  GOOSE_JOB_RAM_MIB: ${GOOSE_JOB_RAM_MIB:-}
  GOOSE_JOB_CPUS: ${GOOSE_JOB_CPUS:-}
  GOOSE_JOB_MEMORY_LIMIT: ${GOOSE_JOB_MEMORY_LIMIT:-}
  GOOSE_JOB_PIDS_LIMIT: ${GOOSE_JOB_PIDS_LIMIT:-}
  GOOSE_JOB_MAX_TURNS: ${GOOSE_JOB_MAX_TURNS:-}
  GOOSE_JOB_SUBAGENT_MAX_TURNS: ${GOOSE_JOB_SUBAGENT_MAX_TURNS:-}
  GOOSE_JOB_REFLECT_ENABLED: ${GOOSE_JOB_REFLECT_ENABLED:-}
  GOOSE_JOB_REFLECT_TIMEOUT_SECONDS: ${GOOSE_JOB_REFLECT_TIMEOUT_SECONDS:-}
  GOOSE_JOB_USE_PASST: ${GOOSE_JOB_USE_PASST:-}
  GOOSE_JOB_WORKSPACE_ROOT: ${GOOSE_JOB_WORKSPACE_ROOT:-}
  GOOSE_JOB_SKILLS_DIR: ${GOOSE_JOB_SKILLS_DIR:-}
  # Optional drop-in agent profiles, imported by the GUI at startup.
  GOOSE_JOB_AGENTS_DIR: ${GOOSE_JOB_AGENTS_DIR:-}
  GOOSE_JOB_DEFAULT_AGENTS_DIR: ${GOOSE_JOB_DEFAULT_AGENTS_DIR:-}
  GOOSE_JOB_TOOLS_DIR: ${GOOSE_JOB_TOOLS_DIR:-}
  GOOSE_JOB_CONFIG_DIR: ${GOOSE_JOB_CONFIG_DIR:-}
  GOOSE_JOB_NETWORK: ${GOOSE_JOB_NETWORK:-}
  GOOSE_JOB_NETWORK_SUBNET: ${GOOSE_JOB_NETWORK_SUBNET:-}
  GOOSE_JOB_NETWORK_INTERFACE: ${GOOSE_JOB_NETWORK_INTERFACE:-}
  GOOSE_JOB_NETWORK_DIR: ${GOOSE_JOB_NETWORK_DIR:-}
  # The network definition lives in the host's rootless Podman storage and is
  # created by scripts/init-job-network.sh. The worker only verifies it.
  GOOSE_JOB_NETWORK_AUTOCREATE: ${GOOSE_JOB_NETWORK_AUTOCREATE:-}
  LLM_PROXY_NETWORK: ${LLM_PROXY_NETWORK:-}
  LLM_PROXY_UPSTREAM_HOST: ${LLM_PROXY_UPSTREAM_HOST:-}
  LLM_PROXY_UPSTREAM_PORT: ${LLM_PROXY_UPSTREAM_PORT:-}
  WORKSPACE_ROOT: ${WORKSPACE_ROOT:-}
  MAX_JOB_TIMEOUT_SECONDS: ${MAX_JOB_TIMEOUT_SECONDS:-}
  ALLOW_UNLIMITED_JOBS: ${ALLOW_UNLIMITED_JOBS:-}
  MAX_RESULT_BYTES: ${MAX_RESULT_BYTES:-}
  MAX_OUTPUT_FILES: ${MAX_OUTPUT_FILES:-}
  UNLIMITED_MAX_TURNS: ${UNLIMITED_MAX_TURNS:-}
  UNLIMITED_MAX_SUBAGENT_TURNS: ${UNLIMITED_MAX_SUBAGENT_TURNS:-}
  UNLIMITED_MAX_POLL_INTERVAL_MS: ${UNLIMITED_MAX_POLL_INTERVAL_MS:-}
  GUI_HOST: ${GUI_HOST:-}
  GUI_PORT: ${GUI_PORT:-}
  GUI_MAX_REQUEST_BYTES: ${GUI_MAX_REQUEST_BYTES:-}
  UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-}
  UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-}
  UPLOAD_MAX_TOTAL_BYTES: ${UPLOAD_MAX_TOTAL_BYTES:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  SERVICE_NAME: ${SERVICE_NAME:-}
  TELEMETRY_CAPTURE_CONTENT: ${TELEMETRY_CAPTURE_CONTENT:-}
  # MLflow is the default observability backend. It ingests OTLP/HTTP traces.
  MLFLOW_ENABLED: ${MLFLOW_ENABLED:-}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
  MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-}

x-worker-environment: &worker-environment
  <<: *app-environment
  # The job-facing URL is resolved inside the microVM to the IPv6 address of
  # the LLM proxy. Do not point this at a Compose service name: the
  # microVM cannot reach the Docker network.
  LLM_PROXY_URL: ${LLM_PROXY_URL:-}
  LLM_PROXY_TOKEN: ${LLM_PROXY_TOKEN:-}
  # The worker polls the MLflow health endpoint over the Compose network.
  MLFLOW_READY_URL: ${MLFLOW_READY_URL:-}
  LLM_PROXY_PORT: ${LLM_PROXY_PORT:-}
  # The worker talks to the rootless Podman API through the mounted Unix socket.
  # No TCP socket proxy is involved.
  PODMAN_SOCKET: ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}
  GOOSE_JOB_DOCKER_HOST: ${GOOSE_JOB_DOCKER_HOST:-}

services:
  # Apache Kafka in KRaft mode: no ZooKeeper, no separate license terms.
  # Internal clients use kafka:9092; host tools use 127.0.0.1:19092.
  kafka:
    image: docker.io/apache/kafka:4.4.0@sha256:76af3d0116abbb33b4cd964af410d4921c33d1f663e7a95d5453a9c35a84869b
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-gaensestall-local-cluster}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # kafbat/kafka-ui is Apache-2.0 and replaces the source-available
  # Redpanda Console for topic inspection.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:2fc9a60b223de6d8cb45a64175afcbb79207ae19306a0b99c558aeaa1b22b6e9
    environment:
      KAFKA_CLUSTERS_0_NAME: gaensestall
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # MLflow owns the tracking database and the AI Gateway. Postgres keeps
  # experiments, traces, and gateway definitions durable across restarts.
  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:005c5c37db96c1e6652a79ea31f9886402fba81ac95dc2db897739121dd7f8f2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gaensestall-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mlflow:
    image: ${GAENSESTALL_MLFLOW_IMAGE:-gaensestall-mlflow:latest}
    build:
      context: .
      dockerfile: infra/mlflow/Dockerfile
    environment:
      # SQLAlchemy needs the explicit psycopg2 driver; the custom image adds it.
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-gaensestall-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
      # The LLM proxy forwards with Host: mlflow:5000. Allow the published UI port
      # as well so the browser and the doctor can reach the same server.
      MLFLOW_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:${MLFLOW_UI_PORT:-5000},127.0.0.1,127.0.0.1:${MLFLOW_UI_PORT:-5000}"
      MLFLOW_GATEWAY_ENDPOINT: ${MLFLOW_GATEWAY_ENDPOINT:-gaensestall}
      MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-0}
      MLFLOW_UI_PORT: ${MLFLOW_UI_PORT:-5000}
      # The provider key is stored encrypted in Postgres. Jobs never see it.
      MLFLOW_CRYPTO_KEK_PASSPHRASE: ${MLFLOW_CRYPTO_KEK_PASSPHRASE:-gaensestall-local-kek}
      LLM_UPSTREAM_BASE_URL: ${LLM_UPSTREAM_BASE_URL:-}
      LLM_UPSTREAM_MODEL: ${LLM_UPSTREAM_MODEL:-}
      LLM_UPSTREAM_API_KEY: ${LLM_UPSTREAM_API_KEY:-}
      LLM_UPSTREAM_INSECURE_SKIP_TLS_VERIFY: ${LLM_UPSTREAM_INSECURE_SKIP_TLS_VERIFY:-false}
      # MLflow's gateway blocks HTTP and private upstream addresses by default.
      # Set these to "https,http" and "true" for local model servers.
      MLFLOW_GATEWAY_API_BASE_ALLOWED_SCHEMES: ${MLFLOW_GATEWAY_API_BASE_ALLOWED_SCHEMES:-https}
      MLFLOW_GATEWAY_API_BASE_ALLOW_PRIVATE_IPS: ${MLFLOW_GATEWAY_API_BASE_ALLOW_PRIVATE_IPS:-false}
    ports:
      - "127.0.0.1:${MLFLOW_UI_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    image: ${GAENSESTALL_WORKER_IMAGE:-gaensestall-worker:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *worker-environment
    init: true
    # Map the image's UID/GID 10001 to the host user. The worker, the job
    # directories, and the microVM guest root then act as the same user, so no
    # world-writable modes or sudo are needed.
    userns_mode: "keep-id:uid=10001,gid=10001"
    volumes:
      - ${GAENSESTALL_JOB_ROOT:-${HOME}/.local/share/gaensestall}:${GAENSESTALL_JOB_ROOT:-${HOME}/.local/share/gaensestall}:z
      # Rootless Podman API. Adjust PODMAN_SOCKET if your UID is not 1000.
      - ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}
    depends_on:
      kafka:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
      # The job microVMs create files with private SELinux categories. The
      # worker is the trusted control plane and must be able to remove them.
      - label=disable
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import pathlib,sys; sys.exit(0 if pathlib.Path('/tmp/gaensestall-worker-ready').exists() else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s

  gui:
    image: ${GAENSESTALL_GUI_IMAGE:-gaensestall-gui:latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment: *app-environment
    expose:
      - "8090"
    # Same UID/GID mapping as the worker so the GUI can write agent profiles
    # into the per-user data root.
    userns_mode: "keep-id:uid=10001,gid=10001"
    volumes:
      - ${GAENSESTALL_JOB_ROOT:-${HOME}/.local/share/gaensestall}:${GAENSESTALL_JOB_ROOT:-${HOME}/.local/share/gaensestall}:z
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('GUI_PORT', '8090') + '/healthz', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      GUI_AUTH_USER: ${GUI_AUTH_USER:-}
      GUI_AUTH_HASH: ${GUI_AUTH_HASH:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
    ports:
      - "${GUI_BIND:-0.0.0.0}:${GUI_PORT:-8090}:8080"
    depends_on:
      gui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=16m
      - /config:size=16m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    profiles: ["storage"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfs}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-gaensestall-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: ${S3_REGION:-local}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  kafka-data:
  rustfs-data:
  mlflow-data:
  postgres-data:

networks:
  # Fixed name: the worker attaches per-job proxies to this network so they can
  # resolve `mlflow` without publishing MLflow to the host.
  default:
    name: gaensestall
