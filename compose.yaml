name: kafkallm

x-app-environment: &app-environment
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Empty values intentionally fall back to the defaults in
  # src/kafkallm/settings.py. That module is the single source of truth.
  JOBS_TOPIC: ${JOBS_TOPIC:-}
  RESULTS_TOPIC: ${RESULTS_TOPIC:-}
  STATE_TOPIC: ${STATE_TOPIC:-}
  EVENTS_TOPIC: ${EVENTS_TOPIC:-}
  AGENTS_TOPIC: ${AGENTS_TOPIC:-}
  SANDBOXES_TOPIC: ${SANDBOXES_TOPIC:-}
  CANCELS_TOPIC: ${CANCELS_TOPIC:-}
  LOGS_TOPIC: ${LOGS_TOPIC:-}
  KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-}
  KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-}
  KAFKA_TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-}
  KAFKA_STARTUP_TIMEOUT_SECONDS: ${KAFKA_STARTUP_TIMEOUT_SECONDS:-}
  WORKER_ID: ${WORKER_ID:-}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
  GOOSE_MODEL: ${GOOSE_MODEL:-}
  GOOSE_PROVIDER: ${GOOSE_PROVIDER:-}
  LLM_UPSTREAM_PROVIDER: ${LLM_UPSTREAM_PROVIDER:-}
  GOOSE_STARTUP_TIMEOUT_SECONDS: ${GOOSE_STARTUP_TIMEOUT_SECONDS:-}
  GOOSE_IMAGE: ${GOOSE_IMAGE:-}
  # Optional reverse-engineering sandbox (REA + Ghidra).
  GOOSE_RE_IMAGE: ${GOOSE_RE_IMAGE:-}
  # The proxy shares the worker's network namespace, so the worker reaches it
  # on loopback. This is the one service-specific default.
  GOOSE_JOB_DOCKER_HOST: ${GOOSE_JOB_DOCKER_HOST:-tcp://127.0.0.1:2375}
  GOOSE_JOB_RAM_MIB: ${GOOSE_JOB_RAM_MIB:-}
  GOOSE_JOB_CPUS: ${GOOSE_JOB_CPUS:-}
  GOOSE_JOB_MEMORY_LIMIT: ${GOOSE_JOB_MEMORY_LIMIT:-}
  GOOSE_JOB_PIDS_LIMIT: ${GOOSE_JOB_PIDS_LIMIT:-}
  GOOSE_JOB_TMPFS_SIZE: ${GOOSE_JOB_TMPFS_SIZE:-}
  GOOSE_JOB_MAX_TURNS: ${GOOSE_JOB_MAX_TURNS:-}
  GOOSE_JOB_SUBAGENT_MAX_TURNS: ${GOOSE_JOB_SUBAGENT_MAX_TURNS:-}
  GOOSE_JOB_REFLECT_ENABLED: ${GOOSE_JOB_REFLECT_ENABLED:-}
  GOOSE_JOB_REFLECT_TIMEOUT_SECONDS: ${GOOSE_JOB_REFLECT_TIMEOUT_SECONDS:-}
  GOOSE_JOB_USE_PASST: ${GOOSE_JOB_USE_PASST:-}
  GOOSE_JOB_WORKSPACE_ROOT: ${GOOSE_JOB_WORKSPACE_ROOT:-}
  GOOSE_JOB_SKILLS_DIR: ${GOOSE_JOB_SKILLS_DIR:-}
  # Optional drop-in agent profiles, imported by the GUI at startup.
  GOOSE_JOB_AGENTS_DIR: ${GOOSE_JOB_AGENTS_DIR:-}
  GOOSE_JOB_DEFAULT_AGENTS_DIR: ${GOOSE_JOB_DEFAULT_AGENTS_DIR:-}
  GOOSE_JOB_TOOLS_DIR: ${GOOSE_JOB_TOOLS_DIR:-}
  GOOSE_JOB_CONFIG_DIR: ${GOOSE_JOB_CONFIG_DIR:-}
  GOOSE_JOB_NETWORK: ${GOOSE_JOB_NETWORK:-}
  GOOSE_JOB_NETWORK_SUBNET: ${GOOSE_JOB_NETWORK_SUBNET:-}
  GOOSE_JOB_NETWORK_INTERFACE: ${GOOSE_JOB_NETWORK_INTERFACE:-}
  GOOSE_JOB_NETWORK_DIR: ${GOOSE_JOB_NETWORK_DIR:-}
  # The network definition lives in the host's rootless Podman storage and is
  # created by scripts/init-job-network.sh. The worker only verifies it.
  GOOSE_JOB_NETWORK_AUTOCREATE: ${GOOSE_JOB_NETWORK_AUTOCREATE:-}
  GOOSE_JOB_PROXY_NETWORK: ${GOOSE_JOB_PROXY_NETWORK:-}
  GOOSE_JOB_PROXY_UPSTREAM_HOST: ${GOOSE_JOB_PROXY_UPSTREAM_HOST:-}
  GOOSE_JOB_PROXY_UPSTREAM_PORT: ${GOOSE_JOB_PROXY_UPSTREAM_PORT:-}
  WORKSPACE_ROOT: ${WORKSPACE_ROOT:-}
  MAX_JOB_TIMEOUT_SECONDS: ${MAX_JOB_TIMEOUT_SECONDS:-}
  ALLOW_UNLIMITED_JOBS: ${ALLOW_UNLIMITED_JOBS:-}
  MAX_RESULT_BYTES: ${MAX_RESULT_BYTES:-}
  MAX_OUTPUT_FILES: ${MAX_OUTPUT_FILES:-}
  UNLIMITED_MAX_TURNS: ${UNLIMITED_MAX_TURNS:-}
  UNLIMITED_MAX_SUBAGENT_TURNS: ${UNLIMITED_MAX_SUBAGENT_TURNS:-}
  UNLIMITED_MAX_POLL_INTERVAL_MS: ${UNLIMITED_MAX_POLL_INTERVAL_MS:-}
  GUI_HOST: ${GUI_HOST:-}
  GUI_PORT: ${GUI_PORT:-}
  GUI_MAX_REQUEST_BYTES: ${GUI_MAX_REQUEST_BYTES:-}
  UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-}
  UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-}
  UPLOAD_MAX_TOTAL_BYTES: ${UPLOAD_MAX_TOTAL_BYTES:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  AGENT_NAME: ${AGENT_NAME:-}
  TELEMETRY_CAPTURE_CONTENT: ${TELEMETRY_CAPTURE_CONTENT:-}
  # MLflow is the default observability backend. It ingests OTLP/HTTP traces.
  MLFLOW_ENABLED: ${MLFLOW_ENABLED:-}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
  MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-}

x-worker-environment: &worker-environment
  <<: *app-environment
  # The job-facing URL is resolved inside the microVM to the IPv6 address of
  # the allowlisting proxy. Do not point this at a Compose service name: the
  # microVM cannot reach the Docker network.
  LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
  LLM_GATEWAY_VIRTUAL_KEY: ${LLM_GATEWAY_VIRTUAL_KEY:-}
  # The worker polls the agentgateway readiness listener over the Compose
  # network. agentgateway has no shell, so Compose cannot healthcheck it.
  LLM_GATEWAY_READY_URL: ${LLM_GATEWAY_READY_URL:-}
  LLM_GATEWAY_PORT: ${LLM_GATEWAY_PORT:-}

services:
  # Apache Kafka in KRaft mode: no ZooKeeper, no separate license terms.
  # Internal clients use kafka:9092; host tools use 127.0.0.1:19092.
  kafka:
    image: docker.io/apache/kafka:4.4.0@sha256:76af3d0116abbb33b4cd964af410d4921c33d1f663e7a95d5453a9c35a84869b
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-kafkallm-local-cluster}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # kafbat/kafka-ui is Apache-2.0 and replaces the source-available
  # Redpanda Console for topic inspection.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:2fc9a60b223de6d8cb45a64175afcbb79207ae19306a0b99c558aeaa1b22b6e9
    environment:
      KAFKA_CLUSTERS_0_NAME: kafkallm
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0@sha256:19f9de44741318515fc3a992429f177420c32d40d971a25f6ae4621a1b9c8516
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      # OTLP exporters in the Compose network use the service name as Host.
      - --allowed-hosts
      - "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    ports:
      - "127.0.0.1:${MLFLOW_UI_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

  podman-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    # Share the worker's network namespace and listen on its loopback only, so
    # the root-equivalent Podman API is reachable by the worker and by nothing
    # else (the job microVMs run in a different namespace).
    network_mode: "service:agent-worker"
    environment:
      SOCKET_PATH: ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}
      BIND_CONFIG: "127.0.0.1:2375"
      CONTAINERS: "1"
      EXEC: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      VERSION: "1"
      PING: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
    volumes:
      # Rootless Podman API (systemctl --user enable --now podman.socket).
      # Adjust PODMAN_SOCKET if your UID is not 1000.
      - ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}
    security_opt:
      - label=disable
    depends_on:
      agent-worker:
        condition: service_started
    restart: unless-stopped

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0@sha256:460dda874be2dfa95fa5713c1f46f26079dce78df576008df704e54a59d5780d
    command: ["-f", "/config/config.yaml"]
    environment:
      # The provider key lives only in this service. The worker and the job
      # microVM receive the virtual key, which the gateway validates and
      # replaces with the provider key before forwarding upstream.
      # Provider selection is rendered into the config before startup.
      LLM_UPSTREAM_API_KEY: ${LLM_UPSTREAM_API_KEY:-${OPENROUTER_API_KEY:-}}
      LLM_GATEWAY_VIRTUAL_KEY: ${LLM_GATEWAY_VIRTUAL_KEY:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_OTLP_HOST: ${MLFLOW_OTLP_HOST:-mlflow}
      MLFLOW_OTLP_PORT: ${MLFLOW_OTLP_PORT:-5000}
      # Gateway spans continue the job trace via the per-job proxy traceparent,
      # so both exporters write to the same MLflow experiment.
      MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-0}
    volumes:
      # The admin UI saves CORS/model changes to this file. It contains no
      # secrets; the provider key stays in the process environment.
      - ./agentgateway/config.generated.yaml:/config/config.yaml:rw,z
    ports:
      # Rootless Podman cannot reach a host service bound only to loopback:
      # host.containers.internal is mapped to the host-side pasta address.
      # The virtual key still gates every request.
      # The LLM listener and the published port are the same value so the
      # browser playground, jobs, and external clients all use one port.
      - "${LLM_GATEWAY_BIND:-0.0.0.0}:${LLM_GATEWAY_PORT:-8091}:${LLM_GATEWAY_PORT:-8091}"
      # agentgateway admin UI; localhost only.
      - "127.0.0.1:${AGENTGATEWAY_UI_PORT:-15000}:15000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      default:
        # Compatibility alias for existing .env files and scripts that still
        # use the old "llm-gateway" hostname.
        aliases:
          - llm-gateway

  agent-worker:
    image: ${KAFKALLM_APP_IMAGE:-kafkallm-app:latest}
    build: .
    environment: *worker-environment
    init: true
    volumes:
      - ${KAFKALLM_JOB_ROOT:-/var/lib/kafkallm}:/var/lib/kafkallm:z
    depends_on:
      kafka:
        condition: service_healthy
      agentgateway:
        condition: service_started
      mlflow:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
      # The job microVMs create files with private SELinux categories. The
      # worker is the trusted control plane and must be able to remove them.
      - label=disable
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import pathlib,sys; sys.exit(0 if pathlib.Path('/tmp/kafkallm-worker-ready').exists() else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s

  gui:
    image: ${KAFKALLM_APP_IMAGE:-kafkallm-app:latest}
    build: .
    command: ["kafkallm", "gui"]
    environment: *app-environment
    expose:
      - "8090"
    volumes:
      # The GUI reads and writes custom agent profiles here.
      - ${GOOSE_JOB_AGENTS_DIR:-/var/lib/kafkallm/agents}:${GOOSE_JOB_AGENTS_DIR:-/var/lib/kafkallm/agents}:z
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('GUI_PORT', '8090') + '/healthz', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      GUI_AUTH_USER: ${GUI_AUTH_USER:-}
      GUI_AUTH_HASH: ${GUI_AUTH_HASH:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
    ports:
      - "${GUI_BIND:-0.0.0.0}:${GUI_PORT:-8090}:8080"
    depends_on:
      gui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=16m
      - /config:size=16m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    profiles: ["storage"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfs}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-kafkallm-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: ${S3_REGION:-local}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  kafka-data:
  rustfs-data:
  mlflow-data:
