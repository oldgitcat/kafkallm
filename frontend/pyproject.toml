[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gaensestall-gui"
version = "0.1.0"
description = "Gänsestall browser UI"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["gui*"]

[tool.setuptools.package-data]
gui = ["static/*.html", "static/*.css", "static/*.js"]
